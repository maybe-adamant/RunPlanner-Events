name: Validate events

# Checks every event folder with the event builder and feed decoder of the planner's latest
# release: strict event.json fields, a project that compiles, dates and id and title rules.
# No secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The planner repository whose releases compile and run the events.
  PLANNER_REPOSITORY: maybe-adamant/RunPlanner

jobs:
  validate:
    name: Validate event folders
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out events
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: events-repo
          persist-credentials: false

      - name: Find the planner's latest release
        id: planner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${PLANNER_REPOSITORY}/releases/latest" --jq .tag_name)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check out the planner release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PLANNER_REPOSITORY }}
          ref: ${{ steps.planner.outputs.tag }}
          path: planner
          persist-credentials: false

      - name: Require the planner's event builder
        env:
          PLANNER_TAG: ${{ steps.planner.outputs.tag }}
        run: |
          if [ ! -f planner/scripts/events-build.mjs ]; then
            echo "Planner ${PLANNER_TAG} predates community events; release a planner with them first." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: planner/.nvmrc
          cache: npm
          cache-dependency-path: planner/package-lock.json

      - name: Install planner dependencies
        working-directory: planner
        run: npm ci --ignore-scripts

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03

      # Builds as if from 2000, so every event, ended ones included, is compiled and listed in the
      # feed, then checks that feed with the planner's own decoder.
      - name: Validate every event folder
        run: |
          (cd planner && npm run events:build -- --events ../events-repo/events --out ../check \
            --now 2000-01-01T00:00:00Z)
          (cd planner && cargo run --quiet --release --locked \
            --manifest-path apps/planner/src-tauri/Cargo.toml \
            -p run-planner-game-host --example events_ci -- check ../check/events.json)
          cat check/summary.txt >> "${GITHUB_STEP_SUMMARY}"
          cat check/summary.txt
